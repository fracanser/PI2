global:
  scrape_interval: 15s # Recoger métricas cada 15 segundos

scrape_configs:
  # 1. Monitorear el propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Monitorear Apache a través de su exporter (httpd no expone /metrics por sí solo)
  - job_name: 'apache'
    static_configs:
      - targets: ['contenedor-apache-exporter:9117']
 # 3. Monitorear MariaDB a través de su exporter
  - job_name: 'mariadb'
    static_configs:
      - targets: ['contenedor-mysqld-exporter:9104']